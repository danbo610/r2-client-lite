name: Build macOS App (Intel x86_64, macOS 13+)

on:
  push:
    branches: [intel-macos13]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Package app (x86_64 cross-build, min macOS 13)
        run: ARCH=x86_64 bash scripts/package_app.sh
      - name: Verify architecture
        run: |
          lipo -archs dist/R2Desk.app/Contents/MacOS/R2Desk
          vtool -show-build dist/R2Desk.app/Contents/MacOS/R2Desk | grep -E "platform|minos"
      - uses: actions/upload-artifact@v4
        with:
          name: R2Desk-macOS-intel
          path: |
            dist/R2Desk-macOS.zip
            dist/R2Desk-macOS.dmg
